version: "3.7"

services:
  mc:
    image: itzg/minecraft-server
    restart: always
    ports:
      - "25565:25565"
      - "24454:24454/udp"
    environment:
      #CF_API_KEY: $$2a$$10$$3rjBrlcmwnywR7KlEAqV0.Wunt4IWADYq8RSojWeYdx97zDGw6qs6
      EULA: "TRUE"
      MEMORY: "13G"
      TYPE: "Fabric"
      FABRIC_LAUNCHER_VERSION: 0.18.4
      FABRIC_LOADER_VERSION: 1.1.1
      VERSION: "1.21.11"
      MOTD: "Muerte al WARDENNNNNNN!!!"
      DIFFICULTY: "normal"
      ICON: "https://wallpaperaccess.com/full/171170.jpg"
      OVERRIDE_ICON: "TRUE"
      MAX_WORLD_SIZE: 29999984
      MODE: "survival"
      ONLINE_MODE: "FALSE"
    volumes:
      - ./data:/data
      - ./downloads/mods:/data/mods

